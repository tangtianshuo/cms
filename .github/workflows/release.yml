name: CMS CI and release

on:
  push:
    branches:
      - master
      - 'release/v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STOREFRONT_TEST_MONGO: mongodb://127.0.0.1:27017/cms_ci
      STOREFRONT_ENABLED: 'true'
      STOREFRONT_GATEWAY_SECRET: ci-test-gateway-secret
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            ui/package-lock.json
      - name: Install Python test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test release metadata and deploy client
        run: python3 -m unittest discover -s ops/test -v
      - name: Install root dependencies
        run: npm ci --ignore-scripts
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts
      - name: Run backend tests
        working-directory: backend
        run: |
          mapfile -t tests < <(find src -type f -name '*.test.ts' -print | sort)
          test "${#tests[@]}" -gt 0
          node -r ts-node/register -r tsconfig-paths/register --test --test-force-exit --test-timeout=60000 "${tests[@]}"
      - name: Run UI tests
        working-directory: ui
        run: node --test test/*.test.mjs
      - name: Check backend types
        working-directory: backend
        run: npm run build:noEmit
      - name: Check UI types
        working-directory: ui
        run: npm run type-check
      - name: Build production UI
        run: npm run build:ui
      - name: Build production backend
        run: npm run build:backend
      - name: Resolve release metadata
        id: release
        run: python3 .github/scripts/release.py

  publish-and-deploy:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: cms-release-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/tangtianshuo/cms
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push release image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ needs.verify.outputs.version }}-sha-${{ github.sha }}
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            RELEASE_VERSION=${{ needs.verify.outputs.version }}
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify image provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}@${IMAGE_DIGEST}" -R tangtianshuo/cms --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Deploy verified image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy.sh
