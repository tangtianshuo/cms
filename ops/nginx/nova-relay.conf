worker_processes 1;
events { worker_connections 512; }
http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  map $http_upgrade $nova_connection { default upgrade; '' close; }
  # Only successful, public build artifacts with content hashes are immutable.
  # Explicit upstream cache policies and HTML fallbacks retain no-store.
  map "$request_method:$upstream_status:$upstream_http_content_type:$upstream_http_cache_control:$uri" $nova_cms_cache_control {
    default "no-store";
    "~^(GET|HEAD):200:(application/javascript|text/javascript|text/css)(;[^:]*)?::/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
  }
  server {
    listen 172.18.0.1:18184 default_server;
    server_name _;
    return 404;
  }
  server {
    listen 172.18.0.1:18184;
    server_name cms.novaintelligent.cn;
    client_max_body_size 100m;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $nova_cms_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ^~ /api/v4/auth/signup-admin { return 404; }
    location / {
      proxy_pass http://127.0.0.1:18182;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Storefront-Key "";
      proxy_set_header X-Storefront-Host "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $nova_connection;
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
  server {
    listen 172.18.0.1:18184;
    server_name shop.novaintelligent.cn fire.novaintelligent.cn;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
      proxy_pass http://127.0.0.1:18180;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
