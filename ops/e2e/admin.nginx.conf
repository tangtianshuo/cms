user nginx;
worker_processes auto;
events { worker_connections 768; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  server {
    listen 80;
    client_max_body_size 25m;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' blob: data:; frame-src 'self' http://127.0.0.1:13001 http://127.0.0.1:18081; frame-ancestors 'self';" always;
    add_header Referrer-Policy no-referrer always;
    proxy_set_header X-Storefront-Key "";
    proxy_set_header X-Storefront-Host "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Host $http_host;
    location /api/v4/socket {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_pass http://cms:8080;
    }
    location / { proxy_pass http://cms:8080; }
  }
}
