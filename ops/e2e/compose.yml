# Owned identity is generated by runtime.mjs init, never a shared global project name.
name: ${COMPOSE_PROJECT_NAME:?}
services:
    mongo:
        image: mongo:7
        environment:
            MONGO_INITDB_ROOT_USERNAME: e2e
            MONGO_INITDB_ROOT_PASSWORD: ${E2E_DB_PASSWORD:?}
        ports: ['127.0.0.1:27029:27017']
        volumes: [mongo-data:/data/db]
        healthcheck:
            test:
                [
                    CMD,
                    mongosh,
                    --quiet,
                    --eval,
                    "quit(db.adminCommand('ping').ok ? 0 : 1)",
                ]
            interval: 3s
            timeout: 3s
            retries: 30
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: e2e
            POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?}
            POSTGRES_DB: gateway_e2e
        ports: ['127.0.0.1:15432:5432']
        volumes: [postgres-data:/var/lib/postgresql]
        healthcheck:
            test: [CMD-SHELL, 'pg_isready -U e2e -d gateway_e2e']
            interval: 3s
            timeout: 3s
            retries: 30
    cms:
        image: ${E2E_CMS_IMAGE:?}
        depends_on:
            mongo: { condition: service_healthy }
        environment:
            NODE_ENV: production
            DB_URL: mongodb://e2e:${E2E_DB_PASSWORD:?}@mongo:27017/cms_docker_e2e?authSource=admin
            JWT_SECRET: ${E2E_JWT_SECRET:?}
            JWT_SCOPE: 127.0.0.1:18080
            JWT_EXP_IN: 3600000
            STOREFRONT_ENABLED: 'true'
            STOREFRONT_HOST: builtin.localhost
            STOREFRONT_MEDIA_ORIGIN: http://127.0.0.1:18080
            STOREFRONT_GATEWAY_SECRET: ${E2E_STOREFRONT_SECRET:?}
            STOREFRONT_DOMAIN_SECRET: ${E2E_DOMAIN_SECRET:?}
            GATEWAY_BASE_URL: https://gateway-tls
            NODE_EXTRA_CA_CERTS: /run/e2e-tls/cert.pem
            GATEWAY_WORKSPACE_ID: ${E2E_GATEWAY_WORKSPACE:?}
            GATEWAY_SITE_ID: ${E2E_GATEWAY_SITE:?}
            GATEWAY_CMS_WORKSPACE_ID: ${E2E_CMS_WORKSPACE:-}
            GATEWAY_CMS_SITE_ID: ${E2E_CMS_SITE:-}
            CMS_SERVICE_SECRET: ${E2E_SERVICE_SECRET:?}
            GATEWAY_PUBLIC_SITE_URL: https://shop.localhost
        volumes:
            - uploads:/app/backend/uploads
            - backups:/app/backend/backups
            - '${E2E_RUNTIME_DIR:?}/tls/cert.pem:/run/e2e-tls/cert.pem:ro'
        healthcheck:
            test:
                [
                    CMD,
                    node,
                    -e,
                    "fetch('http://127.0.0.1:8080/api/v4/health-check',{method:'HEAD'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 3s
            timeout: 3s
            retries: 40
    gateway-control:
        image: ${E2E_GATEWAY_IMAGE:?}
        depends_on:
            postgres: { condition: service_healthy }
        environment:
            DATABASE_URL: postgresql://e2e:${E2E_DB_PASSWORD:?}@postgres:5432/gateway_e2e
            CMS_SERVICE_SECRET: ${E2E_SERVICE_SECRET:?}
            CMS_WORKSPACE_ID: ${E2E_GATEWAY_WORKSPACE:?}
            ALLOWED_TEMPLATE_IDS: aeroframe,fireguard
            SNAPSHOT_STORAGE_PATH: /var/lib/gateway/snapshots
        ports: ['127.0.0.1:18183:18183']
        volumes: ['${E2E_SNAPSHOT_HOST_DIR:?}:/var/lib/gateway/snapshots']
    gateway-tls:
        image: nginx:latest
        depends_on: [gateway-control]
        volumes:
            - ./gateway-tls.nginx.conf:/etc/nginx/nginx.conf:ro
            - '${E2E_RUNTIME_DIR:?}/tls:/run/e2e-tls:ro'
    gateway-ingest:
        image: ${E2E_GATEWAY_IMAGE:?}
        command: [node, apps/ingest/dist/server.js]
        depends_on:
            postgres: { condition: service_healthy }
        environment:
            DATABASE_URL: postgresql://e2e:${E2E_DB_PASSWORD:?}@postgres:5432/gateway_e2e
            HOST: 0.0.0.0
            PORT: '18184'
            INGEST_LOCAL_ORIGINS: http://127.0.0.1:18090
        ports: ['127.0.0.1:18184:18184']
    admin:
        image: nginx:latest
        depends_on:
            cms: { condition: service_healthy }
        ports: ['127.0.0.1:18080:80']
        volumes: [./admin.nginx.conf:/etc/nginx/nginx.conf:ro]
volumes:
    mongo-data:
    postgres-data:
    uploads:
    backups:
