events { worker_connections 128; }
http {
  resolver 127.0.0.11 valid=2s;
  server {
    listen 443 ssl;
    ssl_certificate /run/e2e-tls/cert.pem;
    ssl_certificate_key /run/e2e-tls/key.pem;
    client_max_body_size 16m;
    location / {
      set $control http://gateway-control:18183;
      proxy_pass $control;
    }
  }
}
