services:
    db:
        hostname: db
        image: mongo:7
        environment:
            - MONGO_INITDB_ROOT_USERNAME=test
            - MONGO_INITDB_ROOT_PASSWORD=test1234
        volumes:
            - type: bind
              source: ./db
              target: /data/db
        logging:
            driver: none
    backend:
        depends_on:
            - db
        hostname: backend
        build:
            context: ./
            dockerfile: Dockerfile.backend.dev
        env_file:
            - ./backend/.env
        volumes:
            - type: bind
              source: ./backend/src
              target: /app/backend/src
            - type: bind
              source: ./backend/tsconfig.json
              target: /app/backend/tsconfig.json
            - type: bind
              source: ./backend/logs
              target: /app/backend/logs
            - type: bind
              source: ./backups
              target: /app/backend/backups
            - type: bind
              source: ./uploads
              target: /app/backend/uploads
            - type: bind
              source: ./backend/docs
              target: /app/backend/docs
            - type: bind
              source: ./backend/custom-package.json
              target: /app/backend/custom-package.json
            - type: bind
              source: ./backend/additional
              target: /app/backend/additional
            - type: bind
              source: ./backend/events
              target: /app/backend/events
            - type: bind
              source: ./backend/functions
              target: /app/backend/functions
            - type: bind
              source: ./backend/jobs
              target: /app/backend/jobs
            - type: bind
              source: ./backend/plugins
              target: /app/backend/plugins
            - type: bind
              source: ./README.md
              target: /app/README.md
    ui:
        depends_on:
            - backend
        hostname: ui
        build:
            context: ./
            dockerfile: Dockerfile.ui.dev
        env_file:
            - ./ui/.env
        volumes:
            - type: bind
              source: ./backend/src
              target: /app/backend/src
            - type: bind
              source: ./backend/types
              target: /app/backend/types
            - type: bind
              source: ./ui/src
              target: /app/ui/src
            - type: bind
              source: ./ui/public
              target: /app/ui/public
            - type: bind
              source: ./ui/vite.config.ts
              target: /app/ui/vite.config.ts
            - type: bind
              source: ./ui/index.html
              target: /app/ui/index.html
            - type: bind
              source: ./ui/tsconfig.json
              target: /app/ui/tsconfig.json
            - type: bind
              source: ./ui/tailwind.config.cjs
              target: /app/ui/tailwind.config.cjs
            - type: bind
              source: ./ui/postcss.config.cjs
              target: /app/ui/postcss.config.cjs
    storefront:
        depends_on:
            - backend
        hostname: storefront
        build:
            context: ./
            dockerfile: Dockerfile.storefront.dev
        environment:
            - NUXT_CMS_INTERNAL_ORIGIN=http://backend:8080
            - NUXT_PUBLIC_SITE_HOST=localhost:3000
            - NUXT_PUBLIC_ADMIN_ORIGIN=http://localhost:8080
        ports:
            - '3000:3000'
        volumes:
            - type: bind
              source: ./storefront/app
              target: /app/storefront/app
            - type: bind
              source: ./storefront/server
              target: /app/storefront/server
            - type: bind
              source: ./storefront/utils
              target: /app/storefront/utils
            - type: bind
              source: ./storefront/nuxt.config.ts
              target: /app/storefront/nuxt.config.ts
            - type: bind
              source: ./storefront/tsconfig.json
              target: /app/storefront/tsconfig.json
    proxy:
        depends_on:
            - backend
            - ui
        hostname: proxy
        build:
            context: ./proxy
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
